name: "Build and test"

on: [ push, pull_request ]

jobs:
  build_and_test:
    name: "Build and test"
    runs-on: ubuntu-22.04

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          file: docker/buildhost.dockerfile

          cache-from: type=gha,scope=buildhost
          cache-to: type=gha,scope=buildhost,mode=max

          push: false
          load: true

          tags: buildhost

      - name: Pre-create ~/.cargo subdirs
        run: |
          mkdir --parents ~/.cargo/git
          mkdir --parents ~/.cargo/registry

      - name: Cache ~/.cargo
        uses: actions/cache@v6
        id: cargo_cache
        with:
          key: cargo-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          path: |
            ~/.cargo/git
            ~/.cargo/registry

      - name: Run Cargo check
        run: |
          docker run \
              --rm \
              --mount type=bind,source=$HOME/.cargo/git,target=/home/builder/.cargo/git \
              --mount type=bind,source=$HOME/.cargo/registry,target=/home/builder/.cargo/registry \
              --mount type=bind,source=$(pwd),target=/src \
              buildhost:latest \
              cargo check

      - name: Run Clippy
        run: |
          docker run \
              --rm \
              --mount type=bind,source=$HOME/.cargo/git,target=/home/builder/.cargo/git \
              --mount type=bind,source=$HOME/.cargo/registry,target=/home/builder/.cargo/registry \
              --mount type=bind,source=$(pwd),target=/src \
              buildhost:latest \
              cargo clippy --all-features --all-targets

      - name: Test
        run: |
          docker run \
              --rm \
              --mount type=bind,source=$HOME/.cargo/git,target=/home/builder/.cargo/git \
              --mount type=bind,source=$HOME/.cargo/registry,target=/home/builder/.cargo/registry \
              --mount type=bind,source=$(pwd),target=/src \
              buildhost:latest \
              cargo test

      - name: Build
        run: |
          docker run \
              --rm \
              --mount type=bind,source=$HOME/.cargo/git,target=/home/builder/.cargo/git \
              --mount type=bind,source=$HOME/.cargo/registry,target=/home/builder/.cargo/registry \
              --mount type=bind,source=$(pwd),target=/src \
              buildhost:latest \
              cargo build --release
